<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon - BAMBUK</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      background: linear-gradient(135deg, #000000 0%, #000000 50%, #000000 100%);
      position: relative;
    }

    /* Animated background particles */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .particle {
      position: absolute;
      background: rgba(0, 0, 0, 0.1);
      border-radius: 50%;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
        opacity: 0.5;
      }
      50% {
        transform: translateY(-20px) rotate(180deg);
        opacity: 1;
      }
    }

    /* Loading screen */
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, #000000, #000000, #000000);
      background-size: 400% 400%;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      animation: gradientShift 2s ease-in-out infinite, loadingFadeOut 1.5s ease-out 3.5s forwards;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    
    .loading-logo {
      width: 80px;
      height: 80px;
      border: 4px solid transparent;
      border-top: 4px solid #ffffff;
      border-right: 4px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      animation: loadingSpin 1s linear infinite;
      margin-bottom: 2rem;
      position: relative;
    }

    .loading-logo::before {
      content: '';
      position: absolute;
      top: -8px;
      left: -8px;
      right: -8px;
      bottom: -8px;
      border: 2px solid transparent;
      border-top: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      animation: loadingSpin 2s linear infinite reverse;
    }
    
    .loading-text {
      font-size: 1.5rem;
      font-weight: 300;
      color: #ffffff;
      letter-spacing: 8px;
      opacity: 0.9;
      animation: loadingPulse 2s ease-in-out infinite;
      text-transform: uppercase;
    }
    
    @keyframes loadingSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    @keyframes loadingPulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }
    
    @keyframes loadingFadeOut {
      0% { opacity: 1; visibility: visible; }
      100% { opacity: 0; visibility: hidden; }
    }

    /* Main content */
    .main-content {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      z-index: 2;
      position: relative;
    }

    .brand-logo {
      font-size: 1.2rem;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 6px;
      margin-bottom: 4rem;
      opacity: 0;
      transform: translateY(-20px);
      animation: brandFadeIn 1s ease-out 4.5s forwards;
      text-transform: uppercase;
    }

    .coming-soon-title {
      font-size: clamp(2.5rem, 8vw, 6rem);
      font-weight: 900;
      color: #ffffff;
      letter-spacing: clamp(3px, 1vw, 8px);
      display: flex;
      gap: clamp(2px, 0.5vw, 8px);
      margin-bottom: 3rem;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
    }

    .coming-soon-title span {
      opacity: 0;
      transform: translateY(50px) rotateX(-90deg);
      animation: letterReveal 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      display: inline-block;
      transition: all 0.3s ease;
    }

    .coming-soon-title span:hover {
      color: #888;
      transform: translateY(-10px) scale(1.1);
      text-shadow: 0 5px 15px rgba(255, 255, 255, 0.4);
    }

    @keyframes letterReveal {
      0% {
        opacity: 0;
        transform: translateY(50px) rotateX(-90deg);
      }
      50% {
        opacity: 0.7;
        transform: translateY(-10px) rotateX(-45deg);
      }
      100% {
        opacity: 1;
        transform: translateY(0) rotateX(0deg);
      }
    }

    @keyframes brandFadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .subtitle {
      font-size: 1.1rem;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 3px;
      text-align: center;
      opacity: 0;
      transform: translateY(30px);
      animation: subtitleFadeIn 1s ease-out 6s forwards;
      line-height: 1.6;
    }

    @keyframes subtitleFadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .notification-signup {
      margin-top: 3rem;
      opacity: 0;
      transform: translateY(30px);
      animation: signupFadeIn 1s ease-out 6.5s forwards;
    }

    .signup-form {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .email-input {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50px;
      padding: 12px 24px;
      color: white;
      font-size: 0.95rem;
      width: 280px;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .email-input:focus {
      outline: none;
      border-color: rgba(255, 255, 255, 0.5);
      background: rgba(84, 71, 71, 0.15);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }

    .email-input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .notify-btn {
      background: linear-gradient(45deg, #333, #555);
      border: none;
      border-radius: 50px;
      padding: 12px 30px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.9rem;
    }

    .notify-btn:hover {
      background: linear-gradient(45deg, #555, #777);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 255, 255, 0.2);
    }

    @keyframes signupFadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Staggered animation delays */
    .coming-soon-title span:nth-child(1) { animation-delay: 4.5s; }
    .coming-soon-title span:nth-child(2) { animation-delay: 4.6s; }
    .coming-soon-title span:nth-child(3) { animation-delay: 4.7s; }
    .coming-soon-title span:nth-child(4) { animation-delay: 4.8s; }
    .coming-soon-title span:nth-child(5) { animation-delay: 4.9s; }
    .coming-soon-title span:nth-child(6) { animation-delay: 5.0s; }
    .coming-soon-title span:nth-child(7) { animation-delay: 5.1s; }
    .coming-soon-title span:nth-child(8) { animation-delay: 5.2s; }
    .coming-soon-title span:nth-child(9) { animation-delay: 5.3s; }
    .coming-soon-title span:nth-child(10) { animation-delay: 5.4s; }
    .coming-soon-title span:nth-child(11) { animation-delay: 5.5s; }

    /* Responsive design */
    @media (max-width: 768px) {
      .brand-logo {
        font-size: 1rem;
        letter-spacing: 4px;
        margin-bottom: 3rem;
      }

      .subtitle {
        font-size: 1rem;
        padding: 0 2rem;
      }

      .signup-form {
        flex-direction: column;
        width: 100%;
        padding: 0 2rem;
      }

      .email-input {
        width: 100%;
        max-width: 300px;
      }
    }

    @media (max-width: 480px) {
      .coming-soon-title {
        letter-spacing: 2px;
        gap: 1px;
      }
      
      .brand-logo {
        letter-spacing: 3px;
      }

      .subtitle {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <!-- Animated background particles -->
  <div class="particles" id="particles"></div>

  <!-- Loading screen -->
  <div class="loading-screen">
    <div class="loading-logo"></div>
    <div class="loading-text">BAMBUK</div>
  </div>

  <!-- Main content -->
  <div class="main-content">
    <div class="brand-logo">BAMBUK</div>
    
    <h1 class="coming-soon-title">
      <span>C</span><span>o</span><span>m</span><span>i</span><span>n</span><span>g</span>
      <span>S</span><span>o</span><span>o</span><span>n</span><span>.</span>
    </h1>

    <p class="subtitle">
      Something amazing is being crafted.<br>
      Be the first to experience the future.
    </p>

    <div class="notification-signup">
      <form class="signup-form" onsubmit="handleSignup(event)">
        <input type="email" class="email-input" placeholder="Enter your email" required>
        <button type="submit" class="notify-btn">Notify Me</button>
      </form>
    </div>
  </div>

  <script>
    // Create floating particles
    function createParticles() {
      const particlesContainer = document.getElementById('particles');
      const particleCount = 50;

      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        
        // Random size and position
        const size = Math.random() * 4 + 1;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.top = Math.random() * 100 + '%';
        
        // Random animation delay
        particle.style.animationDelay = Math.random() * 6 + 's';
        particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
        
        particlesContainer.appendChild(particle);
      }
    }

    // Handle email signup
    function handleSignup(event) {
      event.preventDefault();
      const email = event.target.querySelector('.email-input').value;
      
      if (email) {
        // Simulate signup process
        const button = event.target.querySelector('.notify-btn');
        const originalText = button.textContent;
        
        button.textContent = 'Thank You!';
        button.style.background = 'linear-gradient(45deg, #4CAF50, #66BB6A)';
        
        setTimeout(() => {
          button.textContent = originalText;
          button.style.background = '';
          event.target.querySelector('.email-input').value = '';
        }, 2000);
      }
    }

    // Add hover effects to letters
    document.addEventListener('DOMContentLoaded', () => {
      createParticles();
      
      // Add interactive effects after animations complete
      setTimeout(() => {
        const letters = document.querySelectorAll('.coming-soon-title span');
        letters.forEach(letter => {
          letter.addEventListener('mouseenter', () => {
            letter.style.animation = 'none';
          });
          
          letter.addEventListener('mouseleave', () => {
            setTimeout(() => {
              letter.style.animation = '';
            }, 300);
          });
        });
      }, 6000);
    });
  </script>
</body>
</html>
