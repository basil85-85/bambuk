<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon Animation</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #111;
    }

    .coming-soon-title {
      font-size: 3rem;
      font-weight: bold;
      color: #fff;
      letter-spacing: 5px;
      display: flex;
      gap: 5px;
    }

    .coming-soon-title span {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.5s forwards;
    }

    /* Keyframes for the animation */
    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Animate each letter with delay */
    .coming-soon-title span:nth-child(1) { animation-delay: 0.1s; }
    .coming-soon-title span:nth-child(2) { animation-delay: 0.2s; }
    .coming-soon-title span:nth-child(3) { animation-delay: 0.3s; }
    .coming-soon-title span:nth-child(4) { animation-delay: 0.4s; }
    .coming-soon-title span:nth-child(5) { animation-delay: 0.5s; }
    .coming-soon-title span:nth-child(6) { animation-delay: 0.6s; }
    .coming-soon-title span:nth-child(7) { animation-delay: 0.7s; }
    .coming-soon-title span:nth-child(8) { animation-delay: 0.8s; }
    .coming-soon-title span:nth-child(9) { animation-delay: 0.9s; }
    .coming-soon-title span:nth-child(10) { animation-delay: 1s; }
    .coming-soon-title span:nth-child(11) { animation-delay: 1.1s; }
  </style>
</head>
<body>

  <h2 class="coming-soon-title">
    <span>C</span><span>o</span><span>m</span><span>i</span><span>n</span><span>g</span>
    <span>S</span><span>o</span><span>o</span><span>n</span><span>n</span><span>.</span>
  </h2>

</body>
</html>
