        .login-button:disabled {

            border-radius: 2px;

            justify-content: center;

<body>
    <div class="main-container">
        <div class="phone-mockup"></div>
        
        <div class="login-section">
            <div class="login-box">
                <div class="instagram-logo"></div>
                
                <form id="loginForm">
                    <div class="form-group">
                        <input type="text" class="form-input" placeholder="Phone number, username, or email" required>
                    </div>
                    
                    <div class="form-group">
                        <input type="password" class="form-input" placeholder="Password" required>
                    </div>

                    <button type="submit" class="login-button" id="loginBtn">Log in</button>
                </form>

                <div class="divider">
                    <span>or</span>
                </div>

                <a href="#" class="facebook-login" onclick="alert('Facebook login integration would be implemented here')">
                    <div class="facebook-icon">f</div>
                    Log in with Facebook
                </a>

                <a href="#" class="forgot-password" onclick="alert('Password reset would be implemented here')">
                    Forgot password?
                </a>
            </div>

            <div class="signup-box">
                <p class="signup-text">
                    Don't have an account? 
                    <a href="#" class="signup-link" onclick="alert('Sign up page would be implemented here')">Sign up</a>
                </p>
            </div>

            <div class="app-download">
                <p class="get-app-text">Get the app.</p>
                <div class="download-buttons">
                    <button class="download-button app-store" onclick="alert('App Store link would be implemented here')"></button>
                    <button class="download-button google-play" onclick="alert('Google Play link would be implemented here')"></button>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="footer-links">
            <a href="#" class="footer-link">Meta</a>
            <a href="#" class="footer-link">About</a>
            <a href="#" class="footer-link">Blog</a>
            <a href="#" class="footer-link">Jobs</a>
            <a href="#" class="footer-link">Help</a>
            <a href="#" class="footer-link">API</a>
            <a href="#" class="footer-link">Privacy</a>
            <a href="#" class="footer-link">Terms</a>
            <a href="#" class="footer-link">Locations</a>
            <a href="#" class="footer-link">Instagram Lite</a>
            <a href="#" class="footer-link">Contact Uploading & Non-Users</a>
            <a href="#" class="footer-link">Meta Verified</a>
        </div>
        <p class="copyright">© 2024 Instagram from Meta</p>
    </div>

    <script>
        // Form validation and submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const inputs = document.querySelectorAll('.form-input');
            const loginBtn = document.getElementById('loginBtn');
            
            // Check if both fields have values
            let allFieldsFilled = true;
            inputs.forEach(input => {
                if (!input.value.trim()) {
                    allFieldsFilled = false;
                }
            });
            
            if (allFieldsFilled) {
                loginBtn.style.opacity = '0.7';
                loginBtn.textContent = 'Logging in...';
                loginBtn.disabled = true;
                
                setTimeout(() => {
                    alert('Login functionality would be implemented here with backend integration');
                    loginBtn.style.opacity = '1';
                    loginBtn.textContent = 'Log in';
                    loginBtn.disabled = false;
                }, 1500);
            }
        });

        // Enable/disable login button based on input
        const inputs = document.querySelectorAll('.form-input');
        const loginBtn = document.getElementById('loginBtn');

        function checkInputs() {
            let allFieldsFilled = true;
            inputs.forEach(input => {
                if (!input.value.trim()) {
                    allFieldsFilled = false;
                }
            });
            
            if (allFieldsFilled) {
                loginBtn.disabled = false;
                loginBtn.style.opacity = '1';
            } else {
                loginBtn.disabled = true;
                loginBtn.style.opacity = '0.3';
            }
        }

        inputs.forEach(input => {
            input.addEventListener('input', checkInputs);
        });

        // Initialize button state
        checkInputs();
    </script>
</body>
